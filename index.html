<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Nexus</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Markdown Parsing Library -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
        
        /* Markdown Preview Styles */
        #preview-pane h1 { font-size: 1.875rem; font-weight: 700; margin-bottom: 1rem; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.5rem; }
        #preview-pane h2 { font-size: 1.5rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.75rem; }
        #preview-pane h3 { font-size: 1.25rem; font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.5rem; }
        #preview-pane p { margin-bottom: 1rem; line-height: 1.6; color: #374151; }
        #preview-pane ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        #preview-pane ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; }
        #preview-pane blockquote { border-left: 4px solid #2563eb; padding-left: 1rem; color: #6b7280; font-style: italic; margin-bottom: 1rem; }
        #preview-pane code { background: #f3f4f6; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-family: monospace; font-size: 0.875rem; }
        #preview-pane pre { background: #1f2937; color: white; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1rem; }
        #preview-pane pre code { background: transparent; color: inherit; padding: 0; }
        #preview-pane strong { font-weight: 700; }
        #preview-pane em { font-style: italic; }
        #preview-pane del { text-decoration: line-through; color: #9ca3af; }
        #preview-pane hr { margin: 2rem 0; border: 0; border-top: 1px solid #e5e7eb; }
        #preview-pane table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        #preview-pane th, #preview-pane td { border: 1px solid #e5e7eb; padding: 0.5rem 0.75rem; text-align: left; }
        #preview-pane th { background: #f9fafb; }

        html, body { overscroll-behavior-y: contain; }
    #preview-pane th { background: #f9fafb; }

    html, body { overscroll-behavior-y: contain; }

    /* --- Dark mode overrides --- */
    html.dark body {
      background-color: #020617;
      color: #e5e7eb;
    }

    html.dark .bg-white {
      background-color: #020617 !important;
    }
    html.dark .bg-gray-50 {
      background-color: #020617 !important;
    }

    html.dark .border-gray-100,
    html.dark .border-gray-200 {
      border-color: #111827 !important;
    }

    html.dark .text-gray-900,
    html.dark .text-gray-800 {
      color: #e5e7eb !important;
    }
    html.dark .text-gray-700 {
      color: #d1d5db !important;
    }
    html.dark .text-gray-500,
    html.dark .text-gray-400 {
      color: #9ca3af !important;
    }

    html.dark input[type="text"],
    html.dark textarea {
      background-color: #020617;
      color: #e5e7eb;
    }

    html.dark #preview-pane {
      background-color: #020617;
    }
</style>
</head>
<body class="bg-gray-50 text-gray-900 overflow-hidden">

    Add Folder
</button>

<!-- NEW: New File button in sidebar -->
<button onclick="createNewFile()" class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-gray-100 text-gray-700 rounded-xl text-sm font-bold hover:bg-gray-200 transition-all">

</button>

<button onclick="clearLibrary()" class="w-full flex items-center justify-center gap-2 px-4 py-2 text-gray-400 hover:text-red-500 text-xs font-semibold transition-colors">
    <i data-lucide="trash-2" class="w-3 h-3"></i>
    Clear Library
</button>
                </div>
            </div>

                    <p class="px-3 text-xs text-gray-400 italic">No folders connected.</p>

            </div>

            <div class="p-4 bg-gray-50 border-t border-gray-200">
                <div class="flex items-center gap-2 text-[10px] text-gray-400 font-bold uppercase tracking-tighter">
                    <div id="sync-indicator" class="w-2 h-2 rounded-full bg-gray-300"></div>
                    <span id="sync-text">Multi-Source Ready</span>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 flex flex-col min-w-0">
           <header class="h-16 border-b border-gray-200 bg-white flex items-center gap-3 px-4 md:px-6 shrink-0">
    <!-- Sidebar toggle (mobile) -->
    <button onclick="toggleSidebar()" class="p-2 text-gray-500 hover:bg-gray-100 rounded-lg lg:hidden">
        <i data-lucide="menu" class="w-5 h-5"></i>
    </button>

    <!-- Search -->
    <div class="relative flex-1 max-w-xl">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4"></i>
        <input
            type="text"
            id="search-input"
            oninput="handleSearch()"
            placeholder="Search library names, content, tags..."
            class="w-full pl-10 pr-4 py-2 bg-gray-100 border-transparent focus:bg-white focus:ring-2 focus:ring-blue-500 rounded-xl text-sm transition-all outline-none"
        >
    </div>

    <!-- Theme toggle -->
    <button
        id="theme-toggle"
        onclick="toggleTheme()"
        class="ml-2 p-2 rounded-lg border border-gray-200 text-gray-500 hover:bg-gray-100 flex items-center gap-2 text-xs font-semibold"
    >
        <i data-lucide="moon" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Dark</span>
    </button>
</header>

            <div class="flex-1 overflow-y-auto p-4 md:p-6 custom-scrollbar">
                <div class="max-w-6xl mx-auto">
                    <div class="mb-6 flex justify-between items-end">
                        <div>
                            <h2 id="view-title" class="text-xl md:text-2xl font-bold text-gray-800">Unified Library</h2>
                            <p class="text-xs text-gray-400 mt-1">Searching across all connected folders</p>
                        </div>
                        <p id="file-count" class="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full border border-blue-100">0 files</p>
                    </div>
                    <div id="file-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <div class="col-span-full py-20 flex flex-col items-center justify-center text-center opacity-50">
                            <i data-lucide="folder-search" class="w-12 h-12 mb-4 text-gray-300"></i>
                            <p class="text-gray-500 font-medium">Click "Add Folder" to import your OneDrive apps</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- EDITOR MODAL -->
        <div id="editor-modal" class="hidden fixed inset-0 z-50 flex justify-end">
            <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeEditor()"></div>
            <div class="relative w-full lg:max-w-[95%] bg-white shadow-2xl h-full flex flex-col transition-transform duration-300">
                <header class="px-4 md:px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-white shrink-0">
                    <div class="min-w-0 flex-1 mr-4">
                        <input
    id="edit-filename-input"
    type="text"
    class="text-lg font-bold truncate bg-transparent border-none focus:outline-none w-full"
    value="Filename.md"
/>
                        <p id="edit-meta" class="text-[10px] text-gray-400 font-bold uppercase tracking-widest"></p>
                    </div>
                    
                    <div class="flex items-center gap-1 md:gap-2">
                        <!-- View Controls -->
                        <div class="flex bg-gray-100 p-1 rounded-xl mr-2">
                            <button onclick="setEditorMode('edit')" id="btn-mode-edit" class="p-2 rounded-lg transition-all" title="Edit Only">
                                <i data-lucide="edit-3" class="w-4 h-4"></i>
                            </button>
                            <button onclick="setEditorMode('split')" id="btn-mode-split" class="hidden md:block p-2 rounded-lg transition-all" title="Split View">
                                <i data-lucide="layout" class="w-4 h-4"></i>
                            </button>
                            <button onclick="setEditorMode('preview')" id="btn-mode-preview" class="p-2 rounded-lg transition-all" title="Preview Only">
                                <i data-lucide="eye" class="w-4 h-4"></i>
                            </button>
                        </div>

                        <button id="save-btn" onclick="saveChanges()" class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-xl text-sm font-bold hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all whitespace-nowrap">
                            <i data-lucide="save" class="w-4 h-4"></i> <span class="hidden sm:inline">Save</span>
                        </button>
                        <button onclick="closeEditor()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">

                        </button>
                    </div>

                <!-- PANE CONTENT -->
                <div class="flex-1 flex overflow-hidden bg-gray-50">
                    <!-- RAW TEXT AREA -->
                    <textarea id="editor-textarea" 
                        class="flex-1 p-6 md:p-10 font-mono text-base outline-none resize-none bg-white text-gray-800 border-r border-gray-100 leading-relaxed shadow-inner"
                        placeholder="Start typing markdown..."></textarea>
                    
                    <!-- RENDERED PREVIEW -->
                    <div id="preview-pane" 
                        class="flex-1 p-6 md:p-10 overflow-y-auto bg-gray-50 custom-scrollbar prose max-w-none">
                    </div>
                </div>

                <footer class="p-4 bg-white border-t border-gray-100 flex justify-between text-[10px] font-bold text-gray-400 uppercase tracking-widest">
                    <span id="word-count">0 words</span>
                    <div id="view-indicator">Split View</div>
                </footer>
            </div>
        </div>
    </div>

    <script>
        let files = [];
let selectedFile = null;
let searchQuery = "";
let selectedSource = null;
let currentMode = 'split'; // 'edit', 'split', 'preview'

// NEW: store root directory handles by source name (folder name)
let sourceRoots = {};

// Theme state
let currentTheme = 'light';

function applyTheme(theme) {
    currentTheme = theme;
    const root = document.documentElement;
    const btn = document.getElementById('theme-toggle');

    if (theme === 'dark') {
        root.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        if (btn) {
            btn.innerHTML = '<i data-lucide="sun" class="w-4 h-4"></i><span class="hidden sm:inline">Light</span>';
        }
    } else {
        root.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        if (btn) {
            btn.innerHTML = '<i data-lucide="moon" class="w-4 h-4"></i><span class="hidden sm:inline">Dark</span>';
        }
    }

    lucide.createIcons();
}

function toggleTheme() {
    applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
}

function init() {
    lucide.createIcons();

    // Register Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Nexus Service Worker registered.'))
            .catch(err => console.log('SW registration failed:', err));
    }

    // Set default mode based on screen size
    if (window.innerWidth < 768) {
        currentMode = 'edit';
    }

    // Theme init: stored value -> system preference -> light
    const storedTheme = localStorage.getItem('theme');
    if (storedTheme === 'dark' || storedTheme === 'light') {
        applyTheme(storedTheme);
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        applyTheme('dark');
    } else {
        applyTheme('light');
    }
}

        function setEditorMode(mode) {
            currentMode = mode;
            const editor = document.getElementById('editor-textarea');
            const preview = document.getElementById('preview-pane');
            const indicator = document.getElementById('view-indicator');
            
            // UI Button states
            const buttons = ['edit', 'split', 'preview'];
            buttons.forEach(b => {
                const btn = document.getElementById(`btn-mode-${b}`);
                if (btn) {
                    if (b === mode) {
                        btn.classList.add('bg-white', 'text-blue-600', 'shadow-sm');
                        btn.classList.remove('text-gray-500');
                    } else {
                        btn.classList.remove('bg-white', 'text-blue-600', 'shadow-sm');
                        btn.classList.add('text-gray-500');
                    }
                }
            });

            // Pane visibility
            if (mode === 'edit') {
                editor.classList.remove('hidden');
                preview.classList.add('hidden');
                indicator.innerText = "Edit Mode";
            } else if (mode === 'preview') {
                editor.classList.add('hidden');
                preview.classList.remove('hidden');
                indicator.innerText = "Preview Mode";
            } else {
                editor.classList.remove('hidden');
                preview.classList.remove('hidden');
                indicator.innerText = "Split View";
            }
            lucide.createIcons();
        }

        function clearLibrary() {
    if(confirm("Are you sure you want to clear all connected folders? (This won't delete your actual files)")) {
        files = [];
        selectedSource = null;
        sourceRoots = {}; // NEW
        renderFolderTree();
        renderFiles();
    }
}

      async function backgroundLoadContent(rootName) {
            // Grab all files for this source that have no content yet
            const pending = () => files.filter(f => f.source === rootName && f.content === null);
            const BATCH = 5; // read N files at a time to avoid overwhelming mobile I/O

            updateSyncStatus('Indexing content…', 'bg-amber-500');

            while (pending().length > 0) {
                const batch = pending().slice(0, BATCH);
                await Promise.all(batch.map(async file => {
                    try {
                        const fileData = await file.handle.getFile();
                        file.content = await fileData.text();
                        file.preview = file.content.replace(/[#*`]/g, '').substring(0, 80);
                    } catch (e) {
                        file.content = ''; // mark as attempted so we don't retry forever
                    }
                }));

                // Update the count indicator to show indexing progress
                const remaining = pending().length;
                const total = files.filter(f => f.source === rootName).length;
                const done = total - remaining;
                updateSyncStatus(`Indexing ${done}/${total}…`, 'bg-amber-500');

                // Yield to the browser between batches so UI stays responsive
                await new Promise(r => setTimeout(r, 0));
            }

            updateSyncStatus('Sync Active', 'bg-green-500');
            renderFiles(); // final re-render so search now has full content
        }

        async function connectFolder() {
    if (!('showDirectoryPicker' in window)) {
        alert("The File System Access API is not supported in this browser. Please use Chrome or Edge on PC.");
        return;
    }

    try {
        const directoryHandle = await window.showDirectoryPicker();

        // Remember the root handle keyed by its name (matches file.source)
        sourceRoots[directoryHandle.name] = directoryHandle;

        updateSyncStatus('Scanning folder…', 'bg-amber-500');

        // Phase 1: fast metadata-only scan — UI renders immediately after
        await scanDirectory(directoryHandle, directoryHandle.name);
        renderFolderTree();
        renderFiles();
        updateSyncStatus('Loading…', 'bg-amber-400');

        // Phase 2: load all file content in the background (no await)
        // UI is already responsive; search gains content progressively
        backgroundLoadContent(directoryHandle.name);

    } catch (err) {
        console.error(err);
        updateSyncStatus('Ready', 'bg-gray-300');
    }
}

        async function scanDirectory(handle, rootName, currentPath = "") {
            // Collect all entries in parallel batches
            const fileEntries = [];
            const dirEntries = [];

            for await (const entry of handle.values()) {
                if (entry.kind === 'file' && entry.name.endsWith('.md')) {
                    fileEntries.push(entry);
                } else if (entry.kind === 'directory') {
                    dirEntries.push(entry);
                }
            }

            // Read metadata for all files in this directory in parallel (no content yet)
            const metaResults = await Promise.all(fileEntries.map(async entry => {
                const fileData = await entry.getFile();
                return {
                    id: Math.random().toString(36).substr(2, 9),
                    name: entry.name,
                    content: null,           // lazy — loaded on open
                    preview: '',             // filled below
                    path: currentPath || 'Root',
                    source: rootName,
                    handle: entry,
                    updatedAt: new Date(fileData.lastModified).toISOString()
                };
            }));

            files.push(...metaResults);

            // Recurse into subdirectories in parallel
            await Promise.all(dirEntries.map(entry => {
                const newPath = currentPath ? `${currentPath}/${entry.name}` : entry.name;
                return scanDirectory(entry, rootName, newPath);
            }));
        }

        function renderFiles() {
            const grid = document.getElementById('file-grid');
            const countLabel = document.getElementById('file-count');
            const q = searchQuery.toLowerCase();
            const filtered = files.filter(f => {
                // Always search name/path/source; search content only if already loaded
                const matchesSearch = !q ||
                                     f.name.toLowerCase().includes(q) ||
                                     (f.content && f.content.toLowerCase().includes(q)) ||
                                     f.path.toLowerCase().includes(q) ||
                                     f.source.toLowerCase().includes(q);
                const matchesSource = !selectedSource || f.source === selectedSource;
                return matchesSearch && matchesSource;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 flex flex-col items-center justify-center text-center opacity-50"><i data-lucide="search-x" class="w-12 h-12 mb-4 text-gray-300"></i><p class="text-gray-500 font-medium">No files found.</p></div>`;
            } else {
                grid.innerHTML = filtered.map(file => `
                    <div onclick="openEditor('${file.id}')" class="bg-white p-5 rounded-2xl border border-gray-200 hover:border-blue-400 hover:shadow-lg transition-all cursor-pointer flex flex-col h-48 group">
                        <div class="flex justify-between items-start mb-3">
                            <div class="p-2 bg-blue-50 text-blue-600 rounded-lg group-hover:bg-blue-600 group-hover:text-white transition-colors"><i data-lucide="file-text" class="w-5 h-5"></i></div>
                            <span class="text-[9px] uppercase font-bold tracking-widest px-2 py-0.5 rounded-full border bg-blue-50 text-blue-600 border-blue-100">${file.source}</span>
                        </div>
                        <h3 class="font-bold text-gray-900 truncate">${file.name}</h3>
                        <p class="text-[10px] text-gray-400 mb-2 truncate uppercase font-bold tracking-tighter"><i data-lucide="folder" class="inline w-3 h-3 mr-1"></i> ${file.path}</p>
                        <p class="text-sm text-gray-500 line-clamp-2 italic overflow-hidden">${file.preview ? '"' + file.preview + '…"' : '<span class="opacity-40">tap to preview</span>'}</p>
                    </div>
                `).join('');
            }
            countLabel.innerText = `${filtered.length} files`;
            lucide.createIcons();
        }

        function renderFolderTree() {
            const tree = document.getElementById('folder-tree');
            const sources = [...new Set(files.map(f => f.source))].sort();
            if (sources.length === 0) {
                tree.innerHTML = '<p class="px-3 text-xs text-gray-400 italic">No folders connected.</p>';
                return;
            }
            tree.innerHTML = `<div onclick="filterBySource(null)" class="flex items-center gap-2 px-3 py-2 text-sm font-medium ${!selectedSource ? 'bg-blue-50 text-blue-600' : 'text-gray-600 hover:bg-gray-100'} rounded-lg cursor-pointer transition-colors"><i data-lucide="layers" class="w-4 h-4"></i>All Sources</div>` + sources.map(source => `
                <div onclick="filterBySource('${source}')" class="flex items-center gap-2 px-3 py-2 text-sm font-medium ${selectedSource === source ? 'bg-blue-50 text-blue-600' : 'text-gray-600 hover:bg-gray-100'} rounded-lg cursor-pointer transition-colors"><i data-lucide="database" class="w-4 h-4"></i>${source}</div>`).join('');
            lucide.createIcons();
        }

        function filterBySource(source) { selectedSource = source; renderFolderTree(); renderFiles(); }
        function handleSearch() { searchQuery = document.getElementById('search-input').value; renderFiles(); }

     async function openEditor(id) {
    selectedFile = files.find(f => f.id === id);

    const filenameInput = document.getElementById('edit-filename-input');
    if (filenameInput) filenameInput.value = selectedFile.name;

    document.getElementById('edit-meta').innerText = `${selectedFile.source} / ${selectedFile.path}`;
    document.getElementById('editor-modal').classList.remove('hidden');

    const textarea = document.getElementById('editor-textarea');

    // If content not yet loaded, show a loading state and fetch it now
    if (selectedFile.content === null) {
        textarea.value = '';
        textarea.placeholder = 'Loading…';
        try {
            const fileData = await selectedFile.handle.getFile();
            const content = await fileData.text();
            selectedFile.content = content;
            // Cache a short preview for the card
            selectedFile.preview = content.replace(/[#*`]/g, '').substring(0, 80);
        } catch (e) {
            textarea.placeholder = 'Could not load file.';
            return;
        }
    }

    textarea.placeholder = 'Start typing markdown…';
    textarea.value = selectedFile.content;

    // Re-detect mode for best layout on open
    setEditorMode(window.innerWidth < 768 ? 'edit' : 'split');
    updateEditorContent();
    lucide.createIcons();
}

        function updateEditorContent() {
            const text = document.getElementById('editor-textarea').value;
            document.getElementById('preview-pane').innerHTML = marked.parse(text);
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            document.getElementById('word-count').innerText = `${words} words`;
        }

        function closeEditor() { document.getElementById('editor-modal').classList.add('hidden'); }

      async function saveChanges() {
    if (!selectedFile) return;

    const newContent = document.getElementById('editor-textarea').value;

    // Get desired filename from input (fallback to current name)
    const filenameInput = document.getElementById('edit-filename-input');
    let desiredName = filenameInput ? filenameInput.value.trim() : selectedFile.name;

    if (!desiredName) {
        alert("Filename cannot be empty.");
        return;
    }

    // Ensure .md extension
    if (!desiredName.toLowerCase().endsWith('.md')) {
        desiredName += '.md';
    }

    try {
        if (desiredName !== selectedFile.name) {
            // Need to "rename": create new file, write content, delete old file
            const rootHandle = sourceRoots[selectedFile.source];
            if (!rootHandle) {
                alert("Cannot rename because the original folder handle is not available. Try reconnecting the folder.");
                return;
            }

            // Walk into the same folder as the current file
            let dirHandle = rootHandle;
            if (selectedFile.path && selectedFile.path !== 'Root') {
                const segments = selectedFile.path.split('/');
                for (const segment of segments) {
                    if (!segment) continue;
                    dirHandle = await dirHandle.getDirectoryHandle(segment);
                }
            }

            // Create (or overwrite) the new name file
            const newHandle = await dirHandle.getFileHandle(desiredName, { create: true });
            const writableNew = await newHandle.createWritable();
            await writableNew.write(newContent);
            await writableNew.close();

            // Try to remove the old file
            try {
                await dirHandle.removeEntry(selectedFile.name);
            } catch (e) {
                console.warn('Could not delete old file during rename', e);
            }

            // Update in-memory metadata
            selectedFile.name = desiredName;
            selectedFile.handle = newHandle;
        } else {
            // Name unchanged: just overwrite existing file
            if (selectedFile.handle) {
                const writable = await selectedFile.handle.createWritable();
                await writable.write(newContent);
                await writable.close();
            }
        }

        selectedFile.content = newContent;
        selectedFile.updatedAt = new Date().toISOString();

        const saveBtn = document.getElementById('save-btn');
        const originalHTML = saveBtn.innerHTML;
        saveBtn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Saved';
        saveBtn.classList.replace('bg-blue-600', 'bg-emerald-600');

        renderFiles();

        setTimeout(() => {
            saveBtn.innerHTML = originalHTML;
            saveBtn.classList.replace('bg-emerald-600', 'bg-blue-600');
            lucide.createIcons();
        }, 2000);

        lucide.createIcons();
    } catch (err) {
        console.error(err);
        alert("Permission denied. Ensure the folder is still accessible.");
        lucide.createIcons();
    }
}

// NEW: Create a new file in the selected/current source
async function createNewFile() {
    // Must have at least one connected folder
    const sourceKeys = Object.keys(sourceRoots);
    if (!sourceKeys.length) {
        alert("Connect a folder before creating a new file.");
        return;
    }

    // Decide which source to use:
    // 1) selectedSource from the sidebar
    // 2) source of the currently open file
    // 3) source of the first file in the library
    // 4) first connected sourceRoot
    let targetSource = selectedSource
        || (selectedFile ? selectedFile.source : null)
        || (files.length ? files[0].source : null)
        || sourceKeys[0];

    const rootHandle = sourceRoots[targetSource];
    if (!rootHandle) {
        alert("Original folder handle is not available. Try reconnecting the folder.");
        return;
    }

    // Decide target path within that source:
    // If we have a file for that source, use its path; otherwise, use Root
    let baseFile = null;
    if (selectedFile && selectedFile.source === targetSource) {
        baseFile = selectedFile;
    } else {
        const candidates = files.filter(f => f.source === targetSource);
        if (candidates.length) {
            baseFile = candidates[0];
        }
    }

    let dirHandle = rootHandle;
    let targetPath = 'Root';
    if (baseFile && baseFile.path && baseFile.path !== 'Root') {
        const segments = baseFile.path.split('/');
        for (const segment of segments) {
            if (!segment) continue;
            dirHandle = await dirHandle.getDirectoryHandle(segment);
        }
        targetPath = baseFile.path;
    }

    // Unique filename logic: New Note.md, New Note 1.md, etc.
    const baseName = "New Note";
    const ext = ".md";
    let name = baseName + ext;
    let counter = 1;

    while (true) {
        try {
            // If this succeeds, that filename exists already
            await dirHandle.getFileHandle(name);
            name = `${baseName} ${counter}${ext}`;
            counter++;
        } catch (e) {
            // Name not found -> we can use it
            break;
        }
    }

    const defaultContent = "# New Note\n\n";
    const fileHandle = await dirHandle.getFileHandle(name, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(defaultContent);
    await writable.close();

    const newFile = {
        id: Math.random().toString(36).substr(2, 9),
        name,
        content: defaultContent,
        path: targetPath,
        source: targetSource,
        handle: fileHandle,
        updatedAt: new Date().toISOString()
    };

    files.push(newFile);
    renderFiles();
    openEditor(newFile.id);
}
